name: CI

on:
  push:                # build by trigger: every commit
  workflow_dispatch:   # build on demand: "Run workflow" button
  schedule:            # build on schedule: every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code from repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (install dependencies)
        run: pip install pytest

      - name: Run tests
        run: pytest -v --junitxml=report.xml

      - name: Send report (save as artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.xml
